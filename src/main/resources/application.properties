server.port=${PORT:8081}

# Database Configuration:
# - Defaults to embedded H2 (in MySQL compatibility mode) so the app boots successfully on Render immediately.
# - To connect to an external MySQL database, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./salesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Optional Python ML service. Leave empty to use the built-in Java regression
forecast.ml.url=${FORECAST_ML_URL:}
