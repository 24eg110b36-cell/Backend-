server.port=${PORT:8081}

# ---- MySQL (change username/password to yours or set via environment variables) ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sales_forecast_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


# ---- Optional Python ML service. Leave empty to use the built-in Java regression ----
# forecast.ml.url=http://localhost:5000/predict
forecast.ml.url=${FORECAST_ML_URL:}

